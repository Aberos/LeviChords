{% extends "base.html" %}

{% block title %}Alterar senha · LeviChords{% endblock %}

{% block content %}
  <div class="reader-nav">
    <a class="back-link" href="{% url 'account:profile' %}">{% include "includes/icon.html" with name="back" %}<span>Minha conta</span></a>
  </div>
  <h1 class="form-title">Alterar senha</h1>

  <form method="post" class="form card">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="actions">
      <a class="button" href="{% url 'account:profile' %}">Cancelar</a>
      <button type="submit" class="button button-primary">Alterar senha</button>
    </div>
  </form>
{% endblock %}
