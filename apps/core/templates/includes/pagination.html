{% if is_paginated %}
  <nav class="pagination" aria-label="Paginação">
    {% if page_obj.has_previous %}
      <a class="button button-small" href="?page={{ page_obj.previous_page_number }}{% if term %}&amp;q={{ term|urlencode }}{% endif %}">Anterior</a>
    {% endif %}
    <span class="pagination-info">{{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="button button-small" href="?page={{ page_obj.next_page_number }}{% if term %}&amp;q={{ term|urlencode }}{% endif %}">Próxima</a>
    {% endif %}
  </nav>
{% endif %}
