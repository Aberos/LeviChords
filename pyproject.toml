[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levichords"
version = "0.1.0"
description = "A Django application for managing chord sheets and setlists."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.9",
    "django-stubs-ext==6.0.9",
    "gunicorn",
    "psycopg2-binary",
    "python-dotenv",
    "whitenoise",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4,<5",
    "debugpy>=1.8,<2",
    "black==26.10.1",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "django-stubs==6.0.9",
    "pytest",
    "pytest-django",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.black]
line-length = 79
target-version = ["py312"]
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "D",
    "ANN",
    "DJ",
    "ERA",
    "RUF",
]
ignore = ["ANN401", "RUF012"]
allowed-confusables = ["º", "°", "−", "–"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
exclude = ["/migrations/", "^\\.venv/"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
